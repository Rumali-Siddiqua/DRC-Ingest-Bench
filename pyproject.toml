[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drc-ingest-bench"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "klayout",
    "tiktoken",
    "matplotlib",
    "tokenizers",
    "markitdown",
    "python-toon",
    "docopt",
    "pandas",
    "pyyaml",
    "gdstk",
    "tqdm",
    "termcolor",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["generators", "harness"]
